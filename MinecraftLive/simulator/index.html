<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveEvents Simulator</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="app.js"></script>
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">Minecraft Live Integration</p>
            <h1>LiveEvents Simulator</h1>
            <p class="subtitle">
                Dispare presets no servidor como se fossem eventos recebidos durante a live.
            </p>
        </header>

        <section class="panel settings">
            <div class="field">
                <label for="apiUrl">URL da API</label>
                <input id="apiUrl" type="url" value="http://localhost:8765">
            </div>

            <div class="field">
                <label for="token">Token</label>
                <input id="token" type="password" placeholder="Mesmo token do config.yml">
            </div>

            <div class="field">
                <label for="viewer">Espectador</label>
                <input id="viewer" type="text" value="Joao123" maxlength="32">
            </div>

            <div class="field">
                <label for="target">Alvo</label>
                <input id="target" type="text" value="random"
                       placeholder="random, all ou nick">
            </div>

            <button id="btnHealth" class="secondary" type="button">
                Testar conexão
            </button>
        </section>

        <section class="panel">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Presets</p>
                    <h2>Simular interação</h2>
                </div>
                <span id="status" class="status neutral">Aguardando</span>
            </div>

            <div class="preset-grid">
                <button class="preset" data-preset="rose" type="button">
                    <strong>Rosa</strong>
                    <span>Preset rose</span>
                </button>

                <button class="preset" data-preset="follow" type="button">
                    <strong>Novo seguidor</strong>
                    <span>Lobo domesticado</span>
                </button>

                <button class="preset" data-preset="galaxy" type="button">
                    <strong>Galaxy</strong>
                    <span>Raios e TNT</span>
                </button>

                <button class="preset" data-preset="armored_zombie" type="button">
                    <strong>Zumbis blindados</strong>
                    <span>Armadura de ferro</span>
                </button>

                <button class="preset" data-preset="ghast" type="button">
                    <strong>Ataque de Ghast</strong>
                    <span>Ataque aéreo</span>
                </button>
            </div>
        </section>

        <section class="panel custom-panel">
            <div class="field custom-field">
                <label for="customPreset">Preset personalizado</label>
                <input id="customPreset" type="text" placeholder="ex.: universe">
            </div>

            <button id="btnCustom" type="button">
                Executar preset
            </button>
        </section>

        <section class="panel log-panel">
            <div class="section-heading">
                <h2>Últimas ações</h2>
                <button id="btnClear" class="ghost" type="button">Limpar</button>
            </div>
            <div id="log" class="log" aria-live="polite"></div>
        </section>
    </main>
</body>
</html>
